[project]
name = "chart_viewer"
version = "0.1.1"
description = "TradingView-style chart for manually reviewing NQ historical data and practicing drawing analysis."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.0",
    "numpy>=1.24",
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
